<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Support Bot</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Northstar Support</h2>
            <p>Ask about your order, returns, or stock</p>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your question..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>
    <!-- <script src="responses.js"></script> -->
    <script src="intent.js"></script>
    <script src="flows/orderStatus.js"></script>
    <script src="flows/returns.js"></script>
    <script src="app.js"></script>
</body>

</html>
